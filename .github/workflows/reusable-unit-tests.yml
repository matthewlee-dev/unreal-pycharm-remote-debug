name: unit tests

on:
  workflow_call:
  workflow_dispatch:  # Manual trigger

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv reads .python-version and uv.lock, so CI runs the same interpreter
      # and the same pinned tools as a local checkout.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Execute tests
        run: uv run --group test pytest --cov=plugin_src/PyCharmRemoteDebug/Content/Python
