name: unit tests

on:
  workflow_call:
  workflow_dispatch:  # Manual trigger

jobs:
  run-tests:
    # Windows is the majority Unreal platform, and the path handling in
    # bridge.py branches on Path.is_absolute(), which reads a drive-lettered
    # PyCharm location as relative anywhere else. Ubuntu alone never runs the
    # branch a Windows user takes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version and uv.lock, so CI runs the same interpreter
      # and the same pinned tools as a local checkout.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Execute tests
        run: uv run --group test pytest --cov=plugin_src/PyCharmRemoteDebug/Content/Python
