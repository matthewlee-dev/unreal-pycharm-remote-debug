name: static analysis

on:
  workflow_call:
  workflow_dispatch:  # Manual trigger

jobs:

  code-analysis:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # uv reads .python-version and uv.lock, so CI runs the same interpreter
    # and the same pinned tools as a local checkout.
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true

    # scripts/ builds the Fab upload, so it gets the same checks as plugin code
    - name: Analysing the code with ruff
      run: uv run --group dev ruff check plugin_src/PyCharmRemoteDebug/Content/Python/ scripts/

    - name: Checking formatting with ruff
      run: uv run --group dev ruff format --check --diff plugin_src/PyCharmRemoteDebug/Content/Python/ scripts/

    - name: Analysing the code with mypy
      run: uv run --group dev mypy plugin_src/PyCharmRemoteDebug/Content/Python/ scripts/